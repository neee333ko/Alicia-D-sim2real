# ============================================================
# sim_app 场景配置
#
# 只描述「场景里有什么、长什么样」。**不含本轮位姿**：杯子和小方块的位置
# 由 orchestrator 每轮通过 /sim/setup、/sim/place 传到 sim_app，写在这里
# 一定会拿到上一轮的旧位置。
#
# 单位一律 米 / 弧度 / 秒 / 度（字段名带 _deg 的才是度）。
# 坐标系与 task.yaml 的 frame 一致：原点=桌面台面左前角，x 指向机器人，
# y 向左，z 向上。
# ============================================================

# ---------- 两条 unix socket ----------
# 必须和 sim_bridge 的 sim_cmd_sock / sim_state_sock 参数一致。
socket:
  cmd: /tmp/alicia_sim_cmd.sock
  state: /tmp/alicia_sim_state.sock

# ---------- 仿真节奏 ----------
sim:
  device: cuda:0          # 多人共用的卡上跑不动时改成 cpu，先保证能起
  physics_hz: 60          # 物理步长，PD 位置控制的稳定性和它直接相关
  render_hz: 30           # 相机出图频率，和全链路 30Hz 对齐
  state_queue: 256        # state 通道待发帧上限；满了先丢图像，不丢关节/真值

# ---------- 机械臂 ----------
robot:
  # 可加载入口是 physics.usd：它 sublayer 了 base.usd，并补上刚体/关节/质量。
  # robot.usd 只是 IsaacRobotAPI 的元数据描述层（没有子 layer、没有几何），
  # 拿它 spawn 出来是个空 prim。四个文件仍必须同目录，base 按相对路径引用。
  usd: assets/alicia_d_zero_physics.usd
  prim: /World/Robot
  # URDF 导入器把 ArticulationRootAPI 打在根固定关节上，不在根 prim；
  # Isaac Lab 的 Articulation 必须指向这个 prim 才能找到 articulation。
  articulation_prim: /World/Robot/root_joint
  # 临时验证用：抬高 0.3 m 让零位末端离开台面，确认无接触时关节能归零。
  # 验证完必须改回 [0.0, 0.0, 0.0]，否则真机位姿对不上。
  base_pos: [0.0, 0.0, 0.0]
  # 零位下臂朝 -x 伸出，而台面在 +x 一侧（x 从 -0.15 到 1.25），yaw=0 时
  # 整条臂会伸出桌沿、吊在桌外；转 180° 让臂探进台面，基座贴着后边缘。
  base_yaw_deg: 180.0

  # 6 个旋转关节，顺序就是 /joint_commands 前 6 维的顺序
  joints: [Joint1, Joint2, Joint3, Joint4, Joint5, Joint6]

  # 夹爪：ROS 侧 0~1 归一化，这里给出每个物理关节在 0 / 1 两端的位置。
  # 两个手指是独立 prismatic 关节（不是 mimic），方向相反，必须一起下发。
  gripper:
    joints:
      - {name: LGripper, open: 0.025, close: 0.0}
      - {name: RGripper, open: -0.025, close: 0.0}

  # 6 个关节的复位角（弧度）。文件不存在时用全零并打一条警告
  home_pose_file: poses/reset.json

  # drive 已在 create_robot 里改成 force 类型，这里的 stiffness 就是
  # N·m/rad：肩部重力力矩约 6 N·m、允许 0.02 rad 稳态误差 → 600 足够；
  # 夹爪行程只有 25 mm、要夹住方块，刚度取 400。
  actuators:
    arm: {stiffness: 1200.0, damping: 120.0, effort_limit: 30.0}
    gripper: {stiffness: 400.0, damping: 40.0, effort_limit: 5.0}

# ---------- 桌面 ----------
# 台面就是 z=0 平面，所以方块中心 z=edge/2、杯子中心 z=height/2 才对得上
table:
  prim: /World/Table
  size: [1.0, 0.8, 0.04]
  pos: [0.3225, -0.32, -0.02]
  yaw_deg: 90.0           # 绕 z 转 90°，长边沿 y；转完 x 跨 0.8、y 跨 1.0
  color: [0.70, 0.68, 0.63]    # 线性值，取自实拍照片 #D9D6D1

# ---------- 方块 ----------
# 尺寸/质量/摩擦/颜色由 task.yaml 的 object.cube 提供，这里只给 prim 路径
cube:
  prim: /World/Cube

# ---------- 杯子 ----------
# 锥台形杯子（上宽下窄）：用一圈薄板沿锥面倾斜拼出，方块能真的掉进去。
cup:
  prim: /World/Cup
  # 尺寸/壁厚/颜色由 task.yaml 的 object.cup 提供，这里只留纯几何细节
  wall_segments: 32       # 段数越多越圆；32 段在 1280x720 里已经看不出棱
  bottom_thickness: 0.004

# ---------- 相机 ----------
# 分辨率 1280x720、30fps 与 task.yaml 的真机配置一致。
# 内参由 focal_length + horizontal_aperture 算出，导出给 bridge 的 K 就是它。
camera:
  front:
    width: 1280
    height: 720
    # 位姿直接对应 Isaac 面板里 Cam_Front 的 Transform（opengl 语义）：
    # Translate (0.07, -0.21, 0.27)，Orient XYZ (0, -40, -90) 度。
    pos: [0.07, -0.21, 0.27]
    rpy_deg: [0.0, -40.0, -90.0]
    # front 彩色模组原生 1920x1080、FOV 86.2°(H) x 55.2°(V)。输出 1280x720
    # 与原生同为 16:9，整幅缩放不改视场。严格算 fx≈683、fy≈688，
    # 仿真只能给一个焦距，取中 686（水平 86.0°、垂直 55.4°，各差 0.2°），
    # 对应 36mm 画幅下 f=686*36/1280≈19.3mm。
    focal_length: 19.3
    horizontal_aperture: 36.0
  wrist:
    width: 1280
    height: 720
    parent: tool0                 # 挂在夹爪末端，跟着臂一起动
    # 实机安装位置：腕关节背侧、指尖后方，按 Isaac 面板里对齐真机画面的
    # 实测值写死（tool0 局部坐标，单位 m）。
    offset_pos: [-0.05692, 0.0, -0.07971]  # parent 坐标系下的安装偏移
    # 实机安装姿态（固定轴 X-Y-Z 欧拉角，单位度）：roll=180 把光轴从 -Z
    # 翻向指尖方向，yaw=-90 让画面水平轴对齐两指连线，pitch=-20 是略偏的
    # 俯仰补偿。
    offset_rpy_deg: [180.0, -20.0, -90.0]
    # wrist 是 4:3 规格的镜头（80°H × 65°V）。切到 1280x720 相当于上下裁切，
    # 水平 FOV 仍是 80°，所以 f 保持 21.4（1280 宽下 fx≈761）。
    focal_length: 21.4
    horizontal_aperture: 36.0

# ---------- place 的收尾判定 ----------
place:
  home_timeout_s: 4.0     # 回零位最多等这么久，超时按失败回 type=5
  settle_tol_rad: 0.05    # 6 个关节都在这个误差内才算稳住（留出重力下垂余量）
  settle_hold_s: 0.20     # 稳住要持续这么久，避免在过零点上误判
